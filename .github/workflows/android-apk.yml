name: Android APK တည်ဆောက်ခြင်း

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Debug APK တည်ဆောက်ခြင်း
    runs-on: ubuntu-latest

    steps:
      - name: Repository ကိုရယူခြင်း
        uses: actions/checkout@v4

      - name: Java 17 ပြင်ဆင်ခြင်း
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK ပြင်ဆင်ခြင်း
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Gradle 8.7 ပြင်ဆင်ခြင်း
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK တည်ဆောက်ခြင်း
        run: gradle --no-daemon :app:assembleDebug

      - name: APK ကိုသိမ်းဆည်းခြင်း
        uses: actions/upload-artifact@v4
        with:
          name: AR-Roadster-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
